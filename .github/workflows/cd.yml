name: CD - Deploy to ECS

on:
  workflow_run:
    workflows:
      - CI
    branches:
      - master
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: inventory-management
  ECS_CLUSTER: inventory-management-dev
  ECS_SERVICE: inventory-management-dev
  ECS_TASK_DEFINITION: inventory-management-dev
  ECS_CONTAINER_NAME: inventory-management
  IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}

concurrency:
  group: inventory-management-dev-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy to ECS
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'master') ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/master')
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.APPLICATION_DEPLOY_ROLE_ARN }}

      - name: Check whether development infrastructure is online
        id: infrastructure
        run: |
          service_status="$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'services[0].status' \
            --output text 2>/dev/null || true)"
          repository_uri="$(aws ecr describe-repositories \
            --repository-names "$ECR_REPOSITORY" \
            --query 'repositories[0].repositoryUri' \
            --output text 2>/dev/null || true)"

          if [ "$service_status" = "ACTIVE" ] && [ -n "$repository_uri" ] && [ "$repository_uri" != "None" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Development infrastructure is offline; deployment is safely skipped." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Log in to Amazon ECR
        if: steps.infrastructure.outputs.exists == 'true'
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        if: steps.infrastructure.outputs.exists == 'true'
        id: image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          image="$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker build --tag "$image" .
          docker push "$image"
          echo "uri=$image" >> "$GITHUB_OUTPUT"

      - name: Download ECS task definition
        if: steps.infrastructure.outputs.exists == 'true'
        run: |
          aws ecs describe-task-definition \
            --task-definition "$ECS_TASK_DEFINITION" \
            --query taskDefinition \
            --output json > "$RUNNER_TEMP/task-definition.json"

      - name: Render task definition with immutable image
        if: steps.infrastructure.outputs.exists == 'true'
        id: task-definition
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ runner.temp }}/task-definition.json
          container-name: ${{ env.ECS_CONTAINER_NAME }}
          image: ${{ steps.image.outputs.uri }}

      - name: Deploy task definition to ECS
        if: steps.infrastructure.outputs.exists == 'true'
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-definition.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          desired-count: 1
          wait-for-service-stability: true
          wait-max-delay-seconds: 15
