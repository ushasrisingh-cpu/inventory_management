apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: inventory-local

resources:
  - namespace.yaml
  - ../../base
  - configmap.yaml
  - mysql.yaml

images:
  - name: inventory-management
    newName: inventory-management
    newTag: local

patches:
  - target:
      kind: Deployment
      name: inventory-management
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: SPRING_PROFILES_ACTIVE
          valueFrom:
            configMapKeyRef:
              name: inventory-management-config
              key: SPRING_PROFILES_ACTIVE
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: SPRING_DATASOURCE_URL
          valueFrom:
            configMapKeyRef:
              name: inventory-management-config
              key: SPRING_DATASOURCE_URL
